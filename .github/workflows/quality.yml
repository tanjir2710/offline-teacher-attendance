name: Quality checks

on:
  push:
    branches: ["main", "v0.8-firebase-sync"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check v0.8 branch Firebase module syntax
        if: github.ref_name == 'v0.8-firebase-sync'
        run: node --check firebase-sync.mjs
      - name: Run v0.8 branch smoke checks
        if: github.ref_name == 'v0.8-firebase-sync'
        run: node tests/smoke-check.mjs
      - name: Check production Firebase module syntax
        if: github.ref_name == 'main'
        run: node --check firebase-sync.mjs
      - name: Run production smoke checks
        if: github.ref_name == 'main'
        run: node tests/production-smoke-check.mjs
      - name: Check staging Firebase module syntax
        if: github.ref_name == 'main'
        run: node --check staging-v08/firebase-sync.mjs
      - name: Run staging smoke checks
        if: github.ref_name == 'main'
        run: node tests/staging-smoke-check.mjs
