name: Quality checks

on:
  push:
    branches: ["main", "v0.8-firebase-sync"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check Firebase module syntax
        run: node --check firebase-sync.mjs
      - name: Run smoke checks
        run: node tests/smoke-check.mjs
